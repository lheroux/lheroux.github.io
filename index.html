<!DOCTYPE html>
<html>
<head>
  <title>LAURENT HÉROUX</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", serif;
      background: white;
      color: black;
      height: 100%;
      overflow: hidden;
    }
    .view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      animation: fadeIn 1.2s ease-in both;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #net { display: none; }

    /* normal view: links in a circle */
    .link {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .link a {
      color: black;
      text-decoration: none;
    }
    .link a:hover {
      text-decoration: underline;
    }

    /* secret view: neural network */
    #net text {
      font-family: "Times New Roman", serif;
      font-size: 16px;
      fill: black;
    }
    #net a { cursor: pointer; }
    #net a:hover text { text-decoration: underline; }

    .bottom {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    .name {
      display: inline-block;
      margin: 0 0 6px 0;
      user-select: none;
      -webkit-user-select: none;
    }
    #montreal-time { margin: 0; }
  </style>
</head>
<body>
  <div id="circle" class="view"></div>
  <svg id="net" class="view" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="bottom">
    <div class="name" id="name">laurent héroux</div>
    <p id="montreal-time">time in montréal - </p>
  </div>

  <script>
    // name = link text, file = destination page
    const links = [
      { name: "about", file: "about.html" },
      { name: "contact", file: "contact.html" },
      { name: "portfolio", file: "portfolio.html" },
      { name: "archives", file: "archives.html" },
      { name: "ideas", file: "ideas.html" }
    ];

    let mode = 'circle';   // 'circle' or 'net'

    /* ---------- normal view: circle ---------- */
    const circle = document.getElementById('circle');

    function buildCircle() {
      circle.innerHTML = '';
      const n = links.length;
      const radius = Math.max(150, Math.min(window.innerWidth, window.innerHeight) * 0.32);
      links.forEach((link, i) => {
        const angle = (i / n) * 2 * Math.PI;
        const div = document.createElement('div');
        div.className = 'link';
        div.style.left = `calc(50% + ${Math.sin(angle) * radius}px)`;
        div.style.top = `calc(50% + ${-Math.cos(angle) * radius}px)`;
        div.innerHTML = `<a href="${link.file}">${link.name}</a>`;
        circle.appendChild(div);
      });
    }

    /* ---------- secret view: neural network ---------- */
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('net');
    const sizes = [3, 5, 5, links.length];   // input, hidden, hidden, output
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let nodes = [], pulses = [], lastSpawn = 0, lastFrame = 0, running = false;

    function el(tag, attrs, parent) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e);
      return e;
    }

    function buildNet() {
      const W = window.innerWidth, H = window.innerHeight;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = '';
      pulses = [];

      const labelW = Math.min(100, W * 0.25);
      const x0 = W * 0.1, x1 = W * 0.9 - labelW - 14;
      const top = H * 0.06, bottom = H - 110, cy = (top + bottom) / 2;
      const pitch = Math.min(80, (bottom - top) / Math.max(...sizes));

      nodes = sizes.map((n, l) => Array.from({ length: n }, (_, i) => ({
        x: x0 + (x1 - x0) * l / (sizes.length - 1),
        y: cy + (i - (n - 1) / 2) * pitch,
        a: 0, incoming: []
      })));

      const edgeLayer = el('g', {});
      for (let l = 0; l < nodes.length - 1; l++) {
        nodes[l].forEach(a => nodes[l + 1].forEach(b => {
          const line = el('line', {
            x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            stroke: 'black', 'stroke-width': 1, 'stroke-opacity': 0.12
          }, edgeLayer);
          b.incoming.push(line);
        }));
      }

      nodes.forEach((layer, l) => layer.forEach((n, i) => {
        const isOut = l === nodes.length - 1;
        const parent = isOut ? el('a', { href: links[i].file }) : svg;
        n.circle = el('circle', {
          cx: n.x, cy: n.y, r: isOut ? 6 : 4.5,
          fill: 'white', stroke: 'black', 'stroke-width': 1
        }, parent);
        if (isOut) {
          const t = el('text', { x: n.x + 14, y: n.y, dy: '0.35em' }, parent);
          t.textContent = links[i].name;
          el('rect', { x: n.x - 8, y: n.y - 14, width: labelW + 24, height: 28, fill: 'transparent' }, parent);
          parent.addEventListener('mouseenter', () => n.incoming.forEach(e => e.setAttribute('stroke-opacity', 0.7)));
          parent.addEventListener('mouseleave', () => n.incoming.forEach(e => e.setAttribute('stroke-opacity', 0.12)));
        }
      }));
    }

    function spawnPulse(now) {
      const path = nodes.map(layer => layer[Math.floor(Math.random() * layer.length)]);
      const dot = el('circle', { r: 2.5, fill: 'black' });
      pulses.push({ path, dot, start: now, dur: 1800, seg: 0 });
      path[0].a = 1;
    }

    function frame(now) {
      if (!running) return;
      const dt = now - lastFrame; lastFrame = now;
      if (!reduceMotion && now - lastSpawn > 650) { spawnPulse(now); lastSpawn = now; }

      pulses = pulses.filter(p => {
        const prog = (now - p.start) / p.dur;
        if (prog >= 1) { p.dot.remove(); return false; }
        const f = prog * (p.path.length - 1);
        const s = Math.floor(f), u = f - s;
        if (s > p.seg) { p.path[s].a = 1; p.seg = s; }
        const a = p.path[s], b = p.path[s + 1];
        p.dot.setAttribute('cx', a.x + (b.x - a.x) * u);
        p.dot.setAttribute('cy', a.y + (b.y - a.y) * u);
        return true;
      });

      nodes.forEach(layer => layer.forEach(n => {
        if (n.a > 0) {
          n.a = Math.max(0, n.a - dt / 500);
          const g = Math.round(255 * (1 - n.a));
          n.circle.setAttribute('fill', `rgb(${g},${g},${g})`);
        }
      }));
      requestAnimationFrame(frame);
    }

    /* ---------- switching views ---------- */
    function showMode(m) {
      mode = m;
      if (m === 'net') {
        circle.style.display = 'none';
        svg.style.display = 'block';
        buildNet();
        running = true;
        requestAnimationFrame(t => { lastFrame = t; lastSpawn = t; frame(t); });
      } else {
        running = false;
        svg.style.display = 'none';
        circle.style.display = 'block';
        buildCircle();
      }
    }

    // triple click (or triple tap) on the name toggles the views
    const nameEl = document.getElementById('name');
    let taps = [];
    nameEl.addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(t => now - t < 700);
      taps.push(now);
      if (taps.length >= 3) {
        taps = [];
        showMode(mode === 'circle' ? 'net' : 'circle');
      }
    });

    window.addEventListener('resize', () => mode === 'circle' ? buildCircle() : buildNet());
    showMode('circle');

    /* ---------- Montréal time ---------- */
    function updateMontrealTime() {
      const now = new Date();
      const options = {
        timeZone: 'America/Toronto',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = now.toLocaleTimeString('en-CA', options);
      document.getElementById('montreal-time').textContent =
        `time in montréal - ${timeString}`;
    }
    updateMontrealTime();
    setInterval(updateMontrealTime, 1000);
  </script>
</body>
</html>
