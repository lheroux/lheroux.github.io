<!DOCTYPE html>
<html>
<head>
  <title>LAURENT HÉROUX</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", serif;
      background: white;
      color: black;
      height: 100%;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100vh;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      font-style: italic;
      font-size: 2em;
      white-space: nowrap;
    }
    .link {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 1em;
      white-space: nowrap;
    }
    .link a {
      color: black;
      text-decoration: none;
    }
    .link a:hover {
      text-decoration: underline;
    }
    .bottom {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .copyright {
      font-size: 1em;
      margin: 0 0 6px 0;
    }
    #montreal-time {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="stage">
  </div>

  <div class="bottom">
    <div class="copyright">laurent héroux</div>
    <p id="montreal-time">time in montréal - </p>
  </div>

  <script>
    // Add links here. name = link text, file = destination page
    const links = [
      { name: "about", file: "about.html" },
      { name: "contact", file: "contact.html" },
      { name: "portfolio", file: "portfolio.html" },
      { name: "archives", file: "archives.html" },
      { name: "ideas", file: "ideas.html" }
    ];

    const stage = document.getElementById('stage');

    function layoutPositions(n) {
      // returns array of {x, y} in pixels, relative to the center of the screen,
      // spaced evenly on a circle starting at the top and going clockwise
      const radius = Math.max(150, Math.min(window.innerWidth, window.innerHeight) * 0.32);
      const positions = [];
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * 2 * Math.PI;
        positions.push({
          x: Math.sin(angle) * radius,
          y: -Math.cos(angle) * radius
        });
      }
      return positions;
    }

    function render() {
      stage.querySelectorAll('.link').forEach(el => el.remove());
      const positions = layoutPositions(links.length);
      links.forEach((link, i) => {
        const div = document.createElement('div');
        div.className = 'link';
        div.style.left = `calc(50% + ${positions[i].x}px)`;
        div.style.top = `calc(50% + ${positions[i].y}px)`;
        div.innerHTML = `<a href="${link.file}">${link.name}</a>`;
        stage.appendChild(div);
      });
    }

    render();
    window.addEventListener('resize', render);

    function updateMontrealTime() {
      const now = new Date();
      const options = {
        timeZone: 'America/Toronto',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = now.toLocaleTimeString('en-CA', options);
      document.getElementById('montreal-time').textContent =
        `time in montréal - ${timeString}`;
    }
    updateMontrealTime();
    setInterval(updateMontrealTime, 1000);
  </script>
</body>
</html>
