<!DOCTYPE html>
<html>
<head>
  <title>LAURENT HÉROUX</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Times New Roman", serif;
      background: white;
      color: black;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.5s ease-in forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    h1 {
      font-style: italic;
      font-size: 2em;
      margin: 0 0 20px 0;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    .links a {
      color: black;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    #montreal-time {
      margin: 0 0 20px 0;
    }
    .copyright {
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Laurent Héroux</h1>
    <div class="links">
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
      <a href="portfolio.html">portfolio</a>
      <a href="archives.html">archives</a>
      <a href="ideas.html">ideas</a>
    </div>
    <p id="montreal-time">time in montréal - </p>
    <div class="copyright">© laurent héroux 2026</div>
  </div>
  <script>
    function updateMontrealTime() {
      const now = new Date();
      const options = {
        timeZone: 'America/Toronto',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = now.toLocaleTimeString('en-CA', options);
      document.getElementById('montreal-time').textContent =
        `time in montréal - ${timeString}`;
    }
    updateMontrealTime();
    setInterval(updateMontrealTime, 1000);
  </script>
</body>
</html>
